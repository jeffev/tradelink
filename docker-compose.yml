version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: tradelink-postgres
    environment:
      POSTGRES_DB: tradelink
      POSTGRES_USER: tradelink
      POSTGRES_PASSWORD: tradelink_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradelink']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradelink-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backtesting-worker:
    build:
      context: ./apps/backtesting-worker
      dockerfile: Dockerfile
    container_name: tradelink-worker
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: tradelink-backend
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: tradelink
      DB_PASSWORD: tradelink_password
      DB_DATABASE: tradelink
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_URL: http://backtesting-worker:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backtesting-worker:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: tradelink-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
